[package]
name = "wa-windows-installer"
description = "The WA Desk Windows installer: a setup stub with the app appended"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "wa-desk-setup"
path = "src/main.rs"

[[bin]]
name = "pack-setup"
path = "src/bin/pack_setup.rs"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
