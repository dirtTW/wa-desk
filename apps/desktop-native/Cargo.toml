[package]
name = "wa-desktop-native"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "wa-desk-native"
path = "src/main.rs"

[build-dependencies]

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui = "0.37"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ureq = "3"
base64 = { workspace = true }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
rodio = "0.20"
ogg = "0.9"
audiopus = "0.2"
resvg = "0.45"
swash = "0.2"
aes-gcm = "0.10"
getrandom = "0.3"
cpal = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
wa-core = { path = "../../crates/wa-core" }
wa-types = { path = "../../crates/wa-types" }
wa-ui = { path = "../../crates/wa-ui" }

# Clipboard file drops (CF_HDROP) for Ctrl+V.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_LibraryLoader",
    "Win32_Foundation",
] }
# Desktop toasts (Windows) and the tray icon/menu.
tauri-winrt-notification = "0.8"

[target.'cfg(not(windows))'.dependencies]
# Linux/macOS toasts over the session bus.
notify-rust = { version = "4", default-features = false, features = ["z"] }
