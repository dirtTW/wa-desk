name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libssl-dev libxdo-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: wa-desktop-windows
            binary: target/release/wa-desktop.exe
          - os: ubuntu-22.04
            artifact: wa-desktop-linux
            binary: target/release/wa-desktop
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libssl-dev libxdo-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p wa-desktop
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  # On a version tag: build the Windows installers (MSI + NSIS, both with an
  # uninstaller), then push every artifact — the installers and the plain
  # binaries from `build` — to the GitHub release for that tag. The release is
  # created if it does not exist yet, and marked pre-release when the tag has a
  # semver pre-release suffix (e.g. `v0.1.0-rc.3`).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Build the Windows installers
        working-directory: apps/desktop
        run: npx --yes "@tauri-apps/cli@^2" build --bundles msi,nsis
      - name: Push the artifacts to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          pre=""
          case "$tag" in
            *-*) pre="--prerelease" ;;
          esac
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "WA Desk $tag" $pre --generate-notes
          shopt -s globstar nullglob
          assets=(dist/**/* target/release/bundle/msi/*.msi target/release/bundle/nsis/*.exe)
          printf 'attaching to %s:\n' "$tag"
          printf '  %s\n' "${assets[@]}"
          gh release upload "$tag" "${assets[@]}" --clobber
