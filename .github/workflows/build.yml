name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libssl-dev libxdo-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Known-vulnerability scan. `.cargo/audit.toml` records the accepted
      # advisories and why each one cannot be cleared yet.
      - name: Audit dependencies for known vulnerabilities
        run: |
          cargo install cargo-audit --locked
          cargo audit

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: wa-desktop-windows
            binary: target/release/wa-desktop.exe
          - os: ubuntu-22.04
            artifact: wa-desktop-linux
            binary: target/release/wa-desktop
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libssl-dev libxdo-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p wa-desktop
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  # On a version tag: build the Windows installers (MSI + NSIS, both with an
  # uninstaller), then push every artifact — the installers and the plain
  # binaries from `build` — to the GitHub release for that tag. The release is
  # created if it does not exist yet, its body is the matching `CHANGELOG.md`
  # section (plus a diff link to the previous tag), and it is marked
  # pre-release when the tag has a semver pre-release suffix.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Build the Windows installers
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx --yes "@tauri-apps/cli@^2" build --bundles msi,nsis
      - name: Compose the release body from CHANGELOG.md
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag -replace '^v', ''
          $body = [System.Collections.Generic.List[string]]::new()
          $found = $false
          foreach ($line in Get-Content CHANGELOG.md) {
            if (-not $found -and $line.StartsWith("## [$version]")) { $found = $true; continue }
            if ($found -and $line.StartsWith('## [')) { break }
            if ($found) { $body.Add($line) }
          }
          $prev = git describe --tags --abbrev=0 --match 'v*' "$tag^" 2>$null
          if ($LASTEXITCODE -eq 0 -and $prev) {
            $body.Add('')
            $body.Add("**Full Changelog**: https://github.com/$env:GITHUB_REPOSITORY/compare/$prev...$tag")
          }
          Set-Content -Path release-body.md -Value $body -Encoding utf8
          if ($body.Count -eq 0) {
            Write-Error "CHANGELOG.md has no '## [$version]' section"
            exit 1
          }
          Write-Output '----- release body -----'
          Get-Content release-body.md
          # `git describe` above exits non-zero when there is no previous tag,
          # and Actions' pwsh wrapper exits with $LASTEXITCODE. Reset it.
          exit 0
      # `plugins.updater.endpoints` points at this file on the newest release.
      # tauri-plugin-updater fetches it, compares `version` and verifies the
      # installer against the `.sig` produced by TAURI_SIGNING_PRIVATE_KEY.
      - name: Write latest.json for the in-app updater
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag -replace '^v', ''
          $setup = Get-ChildItem 'target/release/bundle/nsis/*-setup.exe' -ErrorAction Stop |
            Select-Object -First 1
          $sigPath = "$($setup.FullName).sig"
          if (-not (Test-Path $sigPath)) {
            Write-Error "no signature at $sigPath - is TAURI_SIGNING_PRIVATE_KEY set?"
            exit 1
          }
          $manifest = [ordered]@{
            version   = $version
            notes     = (Get-Content release-body.md -Raw)
            pub_date  = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = (Get-Content $sigPath -Raw).Trim()
                url       = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$($setup.Name)"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path latest.json -Encoding utf8
          Write-Output '----- latest.json -----'
          Get-Content latest.json
      - name: Push the artifacts to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $pre = if ($tag -match '-') { '--prerelease' } else { $null }
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "WA Desk $tag" $pre --notes-file release-body.md
          }
          $assets = @('latest.json')
          $assets += Get-ChildItem -Path dist -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          $assets += Get-ChildItem -Path target/release/bundle/msi/*, target/release/bundle/nsis/* -File -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          Write-Output "attaching to ${tag}:"
          $assets | ForEach-Object { Write-Output "  $_" }
          gh release upload $tag @assets --clobber
