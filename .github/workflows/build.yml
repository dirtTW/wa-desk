name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# A newer tag for the same ref supersedes an older run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting, lints and the advisory scan: no test compilation, so this runs
  # beside `test` instead of after it (they used to share one serial job).
  lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev pkg-config
      # Keyed on the Rust version, NOT Cargo.lock: a version bump must not throw
      # away the compiled dependency tree (that was most of the run time).
      - id: rustc
        shell: bash
        run: echo "version=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ steps.rustc.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --profile ci -- -D warnings
      # Known-vulnerability scan. `.cargo/audit.toml` records the accepted
      # advisories and why each one cannot be cleared yet. The prebuilt binary
      # installs in seconds; `cargo install` compiled it from source.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev pkg-config
      - id: rustc
        shell: bash
        run: echo "version=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ steps.rustc.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - run: cargo test --workspace --profile ci
      # The native UI is verified headlessly: the selftest folds scripted
      # protocol events and prints what the window would show.
      - run: cargo run -q --profile ci -p wa-desktop-native -- --selftest

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: wa-desk-windows
            binary: target/release/wa-desk-native.exe
          - os: ubuntu-22.04
            artifact: wa-desk-linux
            binary: target/release/wa-desk-native
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev pkg-config
      - id: rustc
        shell: bash
        run: echo "version=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ steps.rustc.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-
      - run: cargo build --release -p wa-desktop-native
      # The Windows installer is the stub binary with the app appended; see
      # apps/windows-installer. The name has no spaces so the release asset URL
      # and `gh release create` keep it intact.
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release -p wa-windows-installer
          cargo run --release -q -p wa-windows-installer --bin pack-setup -- \
            target/release/wa-desk-setup.exe \
            target/release/wa-desk-native.exe \
            "target/release/WA-Desk-Setup.exe"
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/release/wa-desk-native.exe
            target/release/WA-Desk-Setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  # On a version tag: publish the native binaries and the Windows installer.
  # The release body is the matching CHANGELOG.md section plus a diff link, and
  # it is marked pre-release when the tag has a suffix. A failing lint or test
  # job blocks this one, so a red run can never publish.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, build]
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Compose the release body from CHANGELOG.md
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag -replace '^v', ''
          $body = [System.Collections.Generic.List[string]]::new()
          $found = $false
          foreach ($line in Get-Content CHANGELOG.md) {
            if (-not $found -and $line.StartsWith("## [$version]")) { $found = $true; continue }
            if ($found -and $line.StartsWith('## [')) { break }
            if ($found) { $body.Add($line) }
          }
          $prev = git describe --tags --abbrev=0 --match 'v*' "$tag^" 2>$null
          if ($LASTEXITCODE -eq 0 -and $prev) {
            $body.Add('')
            $body.Add("**Full Changelog**: https://github.com/$env:GITHUB_REPOSITORY/compare/$prev...$tag")
          }
          Set-Content -Path release-body.md -Value $body -Encoding utf8
          if ($body.Count -eq 0) {
            Write-Error "CHANGELOG.md has no '## [$version]' section"
            exit 1
          }
          Write-Output '----- release body -----'
          Get-Content release-body.md
          exit 0
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $files = Get-ChildItem dist -Recurse -File | Select-Object -ExpandProperty FullName
          $prerelease = if ($tag -match '-') { '--prerelease' } else { '' }
          $args = @('release', 'create', $tag, '--title', $tag, '--notes-file', 'release-body.md')
          if ($prerelease) { $args += $prerelease }
          $args += $files
          gh @args --repo $env:GITHUB_REPOSITORY
