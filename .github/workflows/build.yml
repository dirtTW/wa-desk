name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The native UI is verified headlessly: the selftest folds scripted
      # protocol events and prints what the window would show.
      - run: cargo run -q -p wa-desktop-native -- --selftest
      # Known-vulnerability scan. `.cargo/audit.toml` records the accepted
      # advisories and why each one cannot be cleared yet.
      - name: Audit dependencies for known vulnerabilities
        run: |
          cargo install cargo-audit --locked
          cargo audit

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: wa-desk-windows
            binary: target/release/wa-desk-native.exe
          - os: ubuntu-22.04
            artifact: wa-desk-linux
            binary: target/release/wa-desk-native
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p wa-desktop-native
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  # On a version tag: publish the native binaries (there is no WebView bundle to
  # package any more). The release body is the matching CHANGELOG.md section plus
  # a diff link, and it is marked pre-release when the tag has a suffix.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    # A red check must block the release, not just fail beside it.
    needs: [check, build]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Compose the release body from CHANGELOG.md
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag -replace '^v', ''
          $body = [System.Collections.Generic.List[string]]::new()
          $found = $false
          foreach ($line in Get-Content CHANGELOG.md) {
            if (-not $found -and $line.StartsWith("## [$version]")) { $found = $true; continue }
            if ($found -and $line.StartsWith('## [')) { break }
            if ($found) { $body.Add($line) }
          }
          $prev = git describe --tags --abbrev=0 --match 'v*' "$tag^" 2>$null
          if ($LASTEXITCODE -eq 0 -and $prev) {
            $body.Add('')
            $body.Add("**Full Changelog**: https://github.com/$env:GITHUB_REPOSITORY/compare/$prev...$tag")
          }
          Set-Content -Path release-body.md -Value $body -Encoding utf8
          if ($body.Count -eq 0) {
            Write-Error "CHANGELOG.md has no '## [$version]' section"
            exit 1
          }
          Write-Output '----- release body -----'
          Get-Content release-body.md
          exit 0
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $files = Get-ChildItem dist -Recurse -File | Select-Object -ExpandProperty FullName
          $prerelease = if ($tag -match '-') { '--prerelease' } else { '' }
          $args = @('release', 'create', $tag, '--title', $tag, '--notes-file', 'release-body.md')
          if ($prerelease) { $args += $prerelease }
          $args += $files
          gh @args --repo $env:GITHUB_REPOSITORY
