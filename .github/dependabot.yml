version: 2
updates:
  # Rust dependencies - the workspace root Cargo.toml / Cargo.lock.
  # `vendor/whatsapp-rust` and `vendor/wacore-appstate` are pinned local
  # patches (via [patch.crates-io] / an excluded workspace member), so they are
  # deliberately not tracked here.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # aes-gcm 0.11 changed the aead API (generate_nonce removed,
      # Nonce::from_slice deprecated) and needs a manual migration in the AI
      # key encryption before it can land. Tracked in issue/PR #4.
      - dependency-name: "aes-gcm"
        update-types:
          - "version-update:semver-major"

  # Keep the workflow actions current (checkout, upload-artifact, rust-cache, ...)
  # so the CI never breaks on a deprecated runner runtime.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  # e2e test tooling (playwright-core). Development only - not shipped.
  - package-ecosystem: "npm"
    directory: "/tests/e2e"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps"
    groups:
      npm-dev:
        patterns:
          - "*"
