# Configuration for GitHub's automatically generated release notes, which the
# `release` job in build.yml uses via `gh release create --generate-notes`.
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
changelog:
  categories:
    - title: Dependencies
      labels:
        - dependencies
    - title: Other changes
      labels:
        - "*"
